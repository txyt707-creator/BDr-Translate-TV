<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDr Translate TV</title><link rel="stylesheet" href="style.css">
<script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script></head>
<body class="showpanel">
<div id="demo-bg"><div class="demo-label">BDr Translate</div></div>
<div id="header"><b>BDr <em>Translate</em></b><span id="state">جاهز للربط</span></div>
<main id="panel">
  <div class="eyebrow">BDr TRANSLATE • TV</div>
  <h1>اربط الآيفون</h1>
  <div class="pin" id="tvPin" aria-label="رمز الربط">------</div>
  <p class="intro">افتح BDr Translate على الآيفون واكتب هذا الرمز فقط</p>
  <div class="connection"><span class="dot" id="dot"></span><span id="relayStatus">جاري تهيئة الشبكة…</span></div>
  <div class="actions">
    <button id="play" autofocus>عرض السوني</button>
    <button id="source">تغيير HDMI</button>
    <button id="retry">إعادة البحث</button>
  </div>
  <p class="source-label" id="sourceLabel">جارِ فحص مداخل HDMI…</p>
</main>
<div id="subtitle"></div>
<div id="hint">OK: إظهار / إخفاء الربط • الأسهم: تغيير الزر • رجوع: إخفاء</div>
<script src="app.js"></script><script src="relay.js"></script>
</body></html>
