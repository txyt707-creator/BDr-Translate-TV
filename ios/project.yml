name: BDrTranslate
options:
  bundleIdPrefix: com.bdrtranslate
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  BDrTranslate:
    type: application
    platform: iOS
    sources:
      - path: BDrTranslate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bdrtranslate.ios
        INFOPLIST_FILE: BDrTranslate/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
