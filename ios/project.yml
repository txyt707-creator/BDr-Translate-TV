name: BDrTranslate
options:
  bundleIdPrefix: com.bdrtranslate
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  BDrTranslate:
    type: application
    platform: iOS
    sources:
      - path: BDrTranslate
    dependencies:
      - target: BDrBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bdrtranslate.ios
        INFOPLIST_FILE: BDrTranslate/Info.plist
        CODE_SIGN_ENTITLEMENTS: BDrTranslate/BDrTranslate.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
  BDrBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BDrBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bdrtranslate.ios.broadcast
        INFOPLIST_FILE: BDrBroadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: BDrBroadcast/BDrBroadcast.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
