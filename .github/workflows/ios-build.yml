name: Build iPhone unsigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: write
jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build iPhone application (unsigned)
        run: |
          xcodebuild -project ios/BDrTranslate.xcodeproj \
            -scheme BDrTranslate \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA for signing on Windows
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BDrTranslate.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../BDrTranslate-iOS-v0.3.1-online-translate-unsigned.ipa Payload
      - name: Publish direct IPA download as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-v0.3.1-online-translate.0 >/dev/null 2>&1 || gh release create ios-v0.3.1-online-translate.0 --title "BDr Translate iOS v0.3.1-online-translate.0 - ReplayKit experimental capture" --notes "Unsigned iOS IPA for personal testing. Requires installation/signing with AltStore or Sideloadly. Experimental ReplayKit extension and OCR. PS Remote Play may block capture; automatic background translation not yet available. Requires compatible signing and App Group entitlement."
          gh release upload ios-v0.3.1-online-translate.0 build/BDrTranslate-iOS-v0.3.1-online-translate-unsigned.ipa --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: BDrTranslate-iOS-v0.3.1-online-translate-UNSIGNED-IPA
          path: build/BDrTranslate-iOS-v0.3.1-online-translate-unsigned.ipa
          if-no-files-found: error
