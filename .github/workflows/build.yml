name: Validate and package unsigned Tizen prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Tizen manifest and assets
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = ['config.xml', 'index.html', 'style.css', 'app.js']
          for p in files:
              assert pathlib.Path(p).is_file(), f'Missing {p}'
          root = ET.parse('config.xml').getroot()
          node = root.find('{http://tizen.org/ns/widgets}application')
          app = root.find('{http://tizen.org/ns/widgets}never-used')
          app = root.find('{http://tizen.org/ns/widgets}application')
          assert app is not None, 'Missing tizen:application'
          pkg = app.attrib.get('package', '')
          aid = app.attrib.get('id', '')
          assert len(pkg) == 10 and pkg.isalnum(), f'Invalid 10-character Tizen package ID: {pkg}'
          assert aid.startswith(pkg + '.'), f'Invalid application ID: {aid}'
          assert root.find('{http://www.w3.org/ns/widgets}content').attrib.get('src') == 'index.html'
          print('Source files and Tizen manifest validation passed.')
          PY
      - name: Archive UNSIGNED prototype (not TV-install-ready)
        run: |
          mkdir -p dist
          zip -j dist/BDr-Translate-TV-v0.4.1-UNSIGNED-test.wgt config.xml index.html style.css app.js relay.js
      - name: Publish direct unsigned TV package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tv-v0.4.1 >/dev/null 2>&1 || gh release create tv-v0.4.1 --title "BDr Translate Samsung TV v0.4.1 - PIN-only pairing" --notes "Unsigned Tizen WGT. Sign with Samsung Partner certificate in Apps2Samsung before installation. No IP entry needed; TV discovers iPhone on same local subnet. Experimental build."
          gh release upload tv-v0.4.1 dist/BDr-Translate-TV-v0.4.1-UNSIGNED-test.wgt --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: BDr-Translate-TV-UNSIGNED-prototype
          path: dist/*.wgt
